{{- if .Values.externalSecrets.enabled }}
{{- range $name, $cfg := .Values.externalSecrets.keys }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "platform-agent-stack.fullname" $ }}-{{ $name }}
  labels: {{- include "platform-agent-stack.labels" $ | nindent 4 }}
spec:
  refreshInterval: {{ $.Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    name: {{ $.Values.externalSecrets.secretStoreRef.name }}
    kind: {{ $.Values.externalSecrets.secretStoreRef.kind }}
  target:
    name: {{ include "platform-agent-stack.fullname" $ }}-{{ $name }}
    creationPolicy: Owner
  data:
    {{- range $cfg.properties }}
    - secretKey: {{ . }}
      remoteRef:
        key: {{ $cfg.remoteKey }}
        property: {{ . }}
    {{- end }}
{{- end }}
{{- end }}
