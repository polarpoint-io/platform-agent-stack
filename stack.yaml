# Everything under `contains` is a directory in this repo.
# `separate_repos` are checked out alongside it.
repo: platform-agent-stack
owns: "Agent topology, risk policy and the pluggable backends, in one place"

contains:
  - path: swarm/
    owns: "Which agents exist, their toolsets, how they're wired — swarm.config.json"
  - path: policy/
    owns: "Risk-tiered action gating — what runs unattended vs. needs approval"
  - path: itsm-providers/
    owns: "Pluggable ITSM MCP backends and their action mappings"
  - path: llm-providers/
    owns: "Which LLM backend agents call — Azure AI Foundry now, Modelplane later"
  - path: confluence-toolset/
    owns: "Read-only Confluence access via REST, for when Confluence MCP isn't available"

separate_repos:
  - repo: ruflo-bridge
    owns: "K8s/Helm/KEDA runtime for the Ruflo MCP bridge"
    why: "Independently released Helm artifact with its own version stream"
  - repo: polarpoint-io/holmesgpt-runbook-mcp
    owns: "Already exists — runbook search/gap-detection/drafting/RCA for sre-investigator"
    why: "Pre-existing, not part of this breakout. runbook_draft is gated at tier_2"
  - repo: mongostate-crossplane
    owns: "Portable Mongo-compatible state store — azure/aws/gcp/baremetal"
    why: "Crossplane XRDs are applied by whoever owns the cluster, often under different RBAC"
