# Builds and publishes the custom MCP bridge (bridge/) this repo's own
# Deployment runs. Replaces build-ruflo-image.yml - bridge/ is plain
# Node/Express + @modelcontextprotocol/sdk, not a Ruflo image, so
# there's no upstream npm package to install here. See bridge/README.md
# for why this exists instead of depending on Ruflo at all.
name: Build bridge image

on:
  push:
    branches: [main]
    paths:
      - bridge/**
      - .github/workflows/build-bridge-image.yml
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Read package version
        id: pkg_version
        run: |
          VERSION=$(node -p "require('./bridge/package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: bridge
          push: true
          tags: |
            ghcr.io/polarpoint-io/platform-agent-bridge:${{ steps.pkg_version.outputs.version }}
            ghcr.io/polarpoint-io/platform-agent-bridge:latest
