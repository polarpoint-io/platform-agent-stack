# Builds and publishes the Ruflo runtime image this repo's own Deployment
# and the sibling ruflo-bridge chart both consume. See Dockerfile's header
# comment for why this exists (no upstream image was ever published).
name: Build Ruflo image

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - .github/workflows/build-ruflo-image.yml
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Ruflo package version
        id: ruflo_version
        run: |
          VERSION=$(npm view ruflo version)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/polarpoint-io/ruflo:${{ steps.ruflo_version.outputs.version }}
            ghcr.io/polarpoint-io/ruflo:latest
