name: diagrams

# Renders docs/diagrams/*.puml to PNG and commits the result, so changing
# a diagram needs nothing installed locally.
#
# Mirrors the PlantUML step in markdown-pol-docs (same plantuml/plantuml
# container, same @startuml-name convention). If that repo ever exposes
# this as a reusable workflow, replace the job below with a `uses:` call
# rather than maintaining a second copy.

on:
  push:
    paths: ['docs/diagrams/**.puml']
  pull_request:
    paths: ['docs/diagrams/**.puml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The branch, not the detached merge commit — we push back to it.
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Render PlantUML to PNG
        run: |
          mkdir -p images/external
          for puml_file in docs/diagrams/*.puml; do
            [ -f "$puml_file" ] || continue
            diagram_name=$(grep -m1 "^@startuml" "$puml_file" | sed 's/@startuml[[:space:]]*//; s/[[:space:]]*$//')
            [ -n "$diagram_name" ] || diagram_name=$(basename "$puml_file" .puml)
            docker run --rm -v "$(pwd):/work" -w /work plantuml/plantuml:latest \
              -o /work/images/external -tpng "$puml_file"
            original_name=$(basename "$puml_file" .puml)
            if [ "$diagram_name" != "$original_name" ] && [ -f "images/external/${original_name}.png" ]; then
              mv "images/external/${original_name}.png" "images/external/${diagram_name}.png"
            fi
          done

      - name: Commit rendered images
        run: |
          if git diff --quiet -- images/external; then
            echo "diagrams already up to date"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/external
          git commit -m "Render C4 diagrams [skip ci]"
          git push
