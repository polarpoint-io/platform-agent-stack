name: validate

# ArgoCD syncs whatever is on main. A bad policy/mapping pair here means
# an action reaches the ITSM backend under the wrong tier — and it fails
# silently, so nothing downstream will tell you. Catch it at PR time.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install pyyaml
      - name: Validate policy, mappings and swarm config
        run: ./charts/platform-agent-stack/scripts/validate-config.sh

  bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - working-directory: bridge
        run: npm install --no-audit --no-fund
      - working-directory: bridge
        run: for f in src/*.js; do node --check "$f"; done

  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: helm lint charts/platform-agent-stack
      - name: Render with the values ArgoCD will use
        run: helm template pas charts/platform-agent-stack --values charts/platform-agent-stack/values.yaml
      - name: Guards must still refuse bad input
        run: |
          set -e
          ! helm template pas charts/platform-agent-stack --set image.tag=latest    2>/dev/null || { echo "::error::semver guard did not fire"; exit 1; }
          ! helm template pas charts/platform-agent-stack --set itsmProvider=nope   2>/dev/null || { echo "::error::provider guard did not fire"; exit 1; }
          echo "all guards fired"
