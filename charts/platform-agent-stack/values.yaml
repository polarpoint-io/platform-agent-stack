# Which ITSM backend to wire in. Must match a file under
# itsm-providers/providers/ AND one under itsm-providers/action-mappings/.
# The chart fails to render if either is missing.
itsmProvider: freshservice

# Which LLM backend to wire in. Must match a file under llm-providers/
# (rename the .example to enable it). The chart fails to render if missing.
llmProvider: modelplane

image:
  # bridge/ in this repo, not a Ruflo image - see bridge/README.md for
  # why. Built and pushed by .github/workflows/build-bridge-image.yml.
  repository: ghcr.io/polarpoint-io/platform-agent-bridge
  tag: "0.1.0"
  pullPolicy: IfNotPresent

replicaCount: 1

service:
  type: ClusterIP
  port: 3000

# The bridge has no authentication of its own - this NetworkPolicy is
# the real access control. Empty means deny-all, not allow-all: there's
# no Slack app or ingress wired up yet (bridge/README.md), so there's
# genuinely no legitimate caller to allow until one exists. Set this
# deliberately once it does.
networkPolicy:
  enabled: true
  allowedNamespaces: []
  allowedPodLabels: {}

# HolmesGPT's own Service (separate chart, separate release - see the
# holmesgpt Application's own values.yaml for the exact name). Real
# endpoint is POST {holmesUrl}/api/chat, confirmed against holmesgpt's
# server.py, not assumed.
holmesUrl: "http://holmes-non-prod-multitenant-holmes.holmesgpt.svc:80"

# holmesgpt-runbook-mcp's Service, same URL Holmes itself is configured
# with (see the holmesgpt Application's mcp_servers.runbook_mcp.config.url).
holmesRunbookMcpUrl: "http://holmesgpt-runbook-mcp.holmesgpt.svc.cluster.local:8080/mcp"

# Slack Incoming Webhook for tier_2/tier_3 notifications. Optional - if
# unset, notifications just get logged instead of posted. Not treated as
# a secret here (a webhook URL is a write-only capability token, lower
# stakes than an API key) but move it to externalSecrets.keys if your
# threat model disagrees.
slackWebhookUrl: ""

# External Secrets Operator. Nothing secret is committed to this repo;
# the chart only names where to find it.
externalSecrets:
  enabled: true
  # TODO(verify): SecretStore name and backing paths are placeholders.
  # Set these to your actual ClusterSecretStore before syncing.
  secretStoreRef:
    name: polarpoint-secret-store
    kind: ClusterSecretStore
  refreshInterval: 1h
  keys:
    # effytech/freshservice_mcp (self-hosted, stdio) needs real credentials
    # injected as env vars - unlike Atlassian's hosted MCP server (the
    # jira-service-management default), which authenticates per-user over
    # OAuth and needs none of these. If you switch itsmProvider back to
    # jira-service-management, this block becomes unused unless you also
    # swap to self-hosted mcp-atlassian.
    itsm:
      remoteKey: platform-agent-stack-itsm
      properties: [FRESHSERVICE_DOMAIN, FRESHSERVICE_APIKEY]
    llm:
      remoteKey: platform-agent-stack-llm
      properties: [MODELPLANE_ENDPOINT, MODELPLANE_API_KEY, MODELPLANE_MODEL]
    confluence:
      remoteKey: platform-agent-stack-confluence
      properties: [CONFLUENCE_BASE_URL, CONFLUENCE_USER, CONFLUENCE_API_TOKEN]

resources:
  requests: { cpu: 250m, memory: 512Mi }
  limits:   { cpu: "2",  memory: 2Gi }

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  seccompProfile: { type: RuntimeDefault }

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities: { drop: ["ALL"] }

nodeSelector: {}
tolerations: []
affinity: {}
