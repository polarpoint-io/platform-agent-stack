# Which ITSM backend to wire in. Must match a file under
# itsm-providers/providers/ AND one under itsm-providers/action-mappings/.
# The chart fails to render if either is missing.
itsmProvider: freshservice

# Which LLM backend to wire in. Must match a file under llm-providers/
# (rename the .example to enable it). The chart fails to render if missing.
llmProvider: anthropic

image:
  # Built and pushed by .github/workflows/build-bridge-image.yml from bridge/.
  repository: ghcr.io/polarpoint-io/platform-agent-bridge
  tag: "0.4.2"
  pullPolicy: IfNotPresent

# Per-tool-call timeout for MCP requests. The SDK default of 60s is too
# short for tools that call an LLM and then a git forge.
mcpToolTimeoutMs: 180000

replicaCount: 1

service:
  type: ClusterIP
  port: 3000

# The bridge has no authentication of its own - this NetworkPolicy is
# the real access control. Empty means deny-all, not allow-all.
networkPolicy:
  enabled: true
  allowedNamespaces: []
  allowedPodLabels: {}

# HolmesGPT's Service. Endpoint called: POST {holmesUrl}/api/chat.
#
# Both URLs below are cluster-local DNS, so this chart has to be deployed
# to the SAME cluster as HolmesGPT - multitenant, via
# argocd-tooling-applications' non-prod-multitenant descriptor. Confirmed
# working end to end 2026-08-05: /triage classifies an infra request,
# sreAgent relays to Holmes, and Holmes investigates the live cluster.
#
# Deployed anywhere else these resolve to nothing and the SRE lane dies
# quietly - mcpBackends.connectAll() is best-effort per backend, so the
# bridge starts happily with runbook_mcp reporting "fetch failed" and
# every runbook verb unavailable. Check /status after moving it.
holmesUrl: "http://holmes-non-prod-multitenant-holmes.holmesgpt.svc:80"

# holmesgpt-runbook-mcp's Service.
holmesRunbookMcpUrl: "http://holmesgpt-runbook-mcp.holmesgpt.svc.cluster.local:8080/mcp"

# That server reports Confluence failures as SUCCESSFUL tool results -
# isError false, with {"error": "Confluence search failed: ..."} as the
# payload - so runbook_search and root_cause_analyse returned HTTP 200 and
# a healthy-looking tier_1 decision while having found nothing at all.
# Same shape the Freshservice provider declares; this backend is configured
# by URL rather than as an mcpServers entry, so it declares it here.
# Matched only against a bare-string result, see executor.js.
holmesRunbookMcpResultIsErrorWhen: '^(Error\b|\{\s*"error":)'

# Slack Incoming Webhook for tier_2/tier_3 notifications. Optional - if
# unset, notifications just get logged instead of posted. Separate from the
# `chat` front door below: this is one-way outbound, that is conversational.
slackWebhookUrl: ""

# The chat front door. none | slack | teams.
#
# none  - /triage is HTTP only. Nothing delivers requests to it, which is the
#         default and is honest about it.
# slack - Socket Mode. Dials OUT over a WebSocket, so it needs no ingress and
#         no public DNS. The right choice on this estate, where every hostname
#         is tailnet-only.
# teams - Bot Framework. Has no Socket Mode equivalent and needs a PUBLIC
#         HTTPS endpoint for /api/messages, which this estate does not have.
#         Read the header of bridge/src/chat/teams.js before choosing it.
#
# Tokens come from ESO like every other credential - add a `chat` entry to
# externalSecrets.keys with the properties the chosen provider needs.
chat:
  provider: none
  # Slack usernames/ids, or Teams AAD object ids, allowed to release a tier-3
  # action. EMPTY MEANS NOBODY. Approving is the one thing that must never
  # default open - until this existed, the only approval path was an
  # unauthenticated POST with a UUID.
  approvers: []

# External Secrets Operator. Nothing secret is committed to this repo;
# the chart only names where to find it.
externalSecrets:
  enabled: true
  # Every cluster in this estate runs ESO with the Kubernetes provider
  # and a ClusterSecretStore of this name, reading from a `secrets-store`
  # namespace on that same cluster - see ansible-rke2-installer's
  # external_secrets role. Nothing is shared across clusters, so the
  # remoteKeys below have to be seeded into whichever cluster this is
  # deployed to before the first sync.
  secretStoreRef:
    name: cluster-secrets-store
    kind: ClusterSecretStore
  refreshInterval: 1h
  keys:
    itsm:
      remoteKey: platform-agent-stack-itsm
      properties: [FRESHSERVICE_DOMAIN, FRESHSERVICE_APIKEY]
    llm:
      remoteKey: platform-agent-stack-llm
      properties: [ANTHROPIC_API_KEY]
    confluence:
      remoteKey: platform-agent-stack-confluence
      properties: [CONFLUENCE_BASE_URL, CONFLUENCE_USER, CONFLUENCE_API_TOKEN]

resources:
  requests: { cpu: 250m, memory: 512Mi }
  limits:   { cpu: "2",  memory: 2Gi }

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  seccompProfile: { type: RuntimeDefault }

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities: { drop: ["ALL"] }

nodeSelector: {}
tolerations: []
affinity: {}

# Optional: durable state for the bridge's pending tier-3 approvals,
# provisioned by mongostate-crossplane's MongoState claim. Crossplane
# only runs on the controller cluster, so this is read cross-cluster via
# a dedicated ClusterSecretStore this chart creates (the one cluster-
# scoped resource in an otherwise namespaced chart - see
# templates/clustersecretstore-controller.yaml). Off by default: the
# bridge falls back to in-memory approvals (see bridge/src/approvalsStore.js)
# when MONGO_URI is unset.
mongoState:
  enabled: false
  # Controller's API server, reachable from this cluster.
  controllerApiServer: "https://192.168.11.70:6443"
  # base64 CA bundle for controllerApiServer. Get it from controller:
  #   kubectl get secret tooling-mongostate-reader-token -n crossplane-system -o jsonpath='{.data.ca\.crt}'
  controllerCaBundle: ""
  # Secret on THIS cluster holding the token minted for controller's
  # tooling-mongostate-reader ServiceAccount (mongostate-crossplane's
  # manifests/rbac-tooling-reader.yaml). Seeded manually - same pattern
  # as every other credential in this chart, just sourced from a
  # different cluster's kubectl instead of a SaaS provider:
  #   kubectl get secret tooling-mongostate-reader-token -n crossplane-system -o jsonpath='{.data.token}' | base64 -d
  #   (on the TOOLING cluster) kubectl create secret generic controller-mongostate-reader-token -n agents --from-literal=token=<pasted value>
  tokenSecretName: controller-mongostate-reader-token
  # The MongoState claim's connection secret.
  #
  # The namespace is `agents`, NOT crossplane-system. Crossplane writes a
  # claim's connection secret into the CLAIM's own namespace when
  # writeConnectionSecretToRef carries only a name, and that claim sets only a
  # name. Getting this wrong reads the wrong namespace and ESO reports a bare
  # "could not get secret data from provider" that says nothing about why.
  remoteSecretName: agent-swarm-state
  remoteSecretNamespace: agents
  # Tailnet name of the MongoDB, exposed from controller by
  # mongostate-crossplane's manifests/tailscale-expose.yaml. When set, the
  # chart creates a local egress Service and points the driver at it - the
  # address inside the connection secret only resolves on controller.
  # Leave empty when the database is in the same cluster.
  tailnetFqdn: ""
  # Name of the local egress Service. Short on purpose: a Service name is a
  # DNS label capped at 63 chars and this chart's fullname is already 62.
  egressServiceName: mongo-egress
