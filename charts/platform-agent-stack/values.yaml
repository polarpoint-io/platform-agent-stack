# Which ITSM backend to wire in. Must match a file under
# itsm-providers/providers/ AND one under itsm-providers/action-mappings/.
# The chart fails to render if either is missing.
itsmProvider: freshservice

# Which LLM backend to wire in. Must match a file under llm-providers/
# (rename the .example to enable it). The chart fails to render if missing.
llmProvider: anthropic

image:
  # Built and pushed by .github/workflows/build-bridge-image.yml from bridge/.
  repository: ghcr.io/polarpoint-io/platform-agent-bridge
  tag: "0.10.0"
  pullPolicy: IfNotPresent

# Jira Service Management, used only when itsmProvider is
# jira-service-management. Both are DEPLOYMENT facts, injected into every tool
# call by the bridge rather than left to the model - Atlassian API-key auth is
# not bound to a site, so every call carries a cloudId, and a cloudId the model
# could choose is one prompt injection could redirect.
#
# The chart FAILS TO RENDER if either is empty while that provider is selected,
# rather than deploying something whose every call 400s.
jira:
  # curl -s https://<your-site>.atlassian.net/_edge/tenant_info
  cloudId: "14b1a00e-e800-4e06-8837-63cc0264ac84"   # polarpoint.atlassian.net
  # The service desk project new tickets are raised in, e.g. SD.
  projectKey: ""

# Per-tool-call timeout for MCP requests. The SDK default of 60s is too
# short for tools that call an LLM and then a git forge.
mcpToolTimeoutMs: 180000

# Safe above 1. Triage jobs are claimed with a single atomic findOneAndUpdate,
# so two replicas cannot take the same job, and the alert poller is leader-
# elected via a Mongo lease so only one replica polls Grafana.
#
# Above 1 REQUIRES durable state - with MONGO_URI unset the store falls back to
# in-memory, and each replica then has its own queue, its own approvals and its
# own idea that it leads. Check /status reports durableState:true before scaling.
replicaCount: 2

service:
  type: ClusterIP
  port: 3000

# Prometheus metrics get their OWN listener and their OWN port, for the same
# reason the Teams endpoint does: a scraper needs to reach this pod, and the
# main port serves /approvals/:id/approve, which takes no credentials. Opening
# port 3000 to the monitoring namespace would let anything running there release
# a parked tier-3 action. Nothing but /metrics is ever mounted on this port.
metrics:
  enabled: true
  port: 9090
  path: /metrics
  # Namespaces whose pods may scrape. Empty means nobody can - same rule as
  # networkPolicy.allowedNamespaces, and for the same reason.
  allowedNamespaces:
    - grafana-alloy

# The bridge has no authentication of its own - this NetworkPolicy is
# the real access control. Empty means deny-all, not allow-all.
networkPolicy:
  enabled: true
  allowedNamespaces: []
  allowedPodLabels: {}

# HolmesGPT's Service. Endpoint called: POST {holmesUrl}/api/chat.
#
# Both URLs below are cluster-local DNS, so this chart has to be deployed
# to the SAME cluster as HolmesGPT - multitenant, via
# argocd-tooling-applications' non-prod-multitenant descriptor. Confirmed
# working end to end 2026-08-05: /triage classifies an infra request,
# sreAgent relays to Holmes, and Holmes investigates the live cluster.
#
# Deployed anywhere else these resolve to nothing and the SRE lane dies
# quietly - mcpBackends.connectAll() is best-effort per backend, so the
# bridge starts happily with runbook_mcp reporting "fetch failed" and
# every runbook verb unavailable. Check /status after moving it.
holmesUrl: "http://holmes-non-prod-multitenant-holmes.holmesgpt.svc:80"

# holmesgpt-runbook-mcp's Service.
holmesRunbookMcpUrl: "http://holmesgpt-runbook-mcp.holmesgpt.svc.cluster.local:8080/mcp"

# That server reports Confluence failures as SUCCESSFUL tool results -
# isError false, with {"error": "Confluence search failed: ..."} as the
# payload - so runbook_search and root_cause_analyse returned HTTP 200 and
# a healthy-looking tier_1 decision while having found nothing at all.
# Same shape the Freshservice provider declares; this backend is configured
# by URL rather than as an mcpServers entry, so it declares it here.
# Matched only against a bare-string result, see executor.js.
holmesRunbookMcpResultIsErrorWhen: '^(Error\b|\{\s*"error":)'

# Slack Incoming Webhook for tier_2/tier_3 notifications. Optional - if
# unset, notifications just get logged instead of posted. Separate from the
# `chat` front door below: this is one-way outbound, that is conversational.
slackWebhookUrl: ""

# The chat front door. none | slack | teams.
#
# none  - /triage is HTTP only. Nothing delivers requests to it, which is the
#         default and is honest about it.
# slack - Socket Mode. Dials OUT over a WebSocket, so it needs no ingress and
#         no public DNS. The right choice on this estate, where every hostname
#         is tailnet-only.
# teams - Bot Framework. Has no Socket Mode equivalent and needs a PUBLIC
#         HTTPS endpoint for /api/messages, which this estate does not have.
#         Read the header of bridge/src/chat/teams.js before choosing it.
#
# Tokens come from ESO like every other credential - add a `chat` entry to
# externalSecrets.keys with the properties the chosen provider needs.
chat:
  provider: none
  # Slack usernames/ids, or Teams AAD object ids, allowed to release a tier-3
  # action. EMPTY MEANS NOBODY. Approving is the one thing that must never
  # default open - until this existed, the only approval path was an
  # unauthenticated POST with a UUID.
  approvers: []

  # The inbound endpoint, for a provider that cannot dial out.
  #
  # Slack does not need this and must not have it: Socket Mode opens an outbound
  # WebSocket, so there is nothing to expose. Teams has no equivalent - the Bot
  # Framework POSTs to an endpoint you host - so it needs one.
  #
  # It is a SEPARATE port with only /api/messages on it, served by its own
  # Service. The bridge's main port authenticates nothing, and
  # /approvals/:id/approve will run a parked tier-3 action for anyone who can
  # reach it, so exposing the main port to serve one webhook would put that on
  # the internet. Point an Ingress or a Tailscale Funnel at the -endpoint
  # Service, never at the main one.
  endpoint:
    enabled: false
    port: 3979
    serviceAnnotations: {}

# Grafana alerts -> /triage. The only path by which the agent notices something
# without a human asking; everything else is someone typing in a chat client.
#
# TWO intakes, and either or both may be used - see `webhook` below.
#
# POLLING is the default and dials OUT. Alerting happens in Grafana Cloud,
# outside the estate, and the bridge is tailnet-only behind a deny-all
# NetworkPolicy with no authentication of its own - so nothing out there can
# reach in. Polling works the same way Slack's Socket Mode does: no public
# endpoint, no inbound auth, no new attack surface. It is the only option when
# Grafana genuinely cannot reach you.
#
# GRAFANA_URL and GRAFANA_TOKEN come from ESO like every other credential - add
# a `grafana` entry to externalSecrets.keys. The token only needs to read
# alerts.
alerts:
  enabled: false
  pollSeconds: 60
  # OPT-IN, and deliberately so. Without a selector every warning in the estate
  # becomes a triage job and then a ticket, and the ones that matter drown.
  # Label the handful of rules that genuinely want an agent looking at them.
  labelKey: agent
  labelValue: triage

  # PUSH intake, as an alternative or a complement to polling above.
  #
  # Polling dials out and needs no exposure at all, which is the right default
  # here and the only option when Grafana cannot reach you. A webhook is lower
  # latency (no up-to-pollSeconds delay), costs nothing while quiet, and needs
  # NO leader election - the Service delivers each POST to exactly one replica,
  # which is the thing the poller needs a Mongo lease to arrange.
  #
  # The cost is a public, authenticated endpoint. It mounts on the SAME separate
  # listener as the Teams route, never on the main port, and it FAILS CLOSED:
  # with no token the route is not mounted at all, because an unauthenticated
  # public route that enqueues LLM work and raises tickets is an open invitation.
  #
  # Both intakes may run at once. They share the fingerprint dedupe, so the same
  # firing arriving via both still produces one triage job.
  #
  # In Grafana: Alerting -> Contact points -> Webhook, URL pointing at the
  # -endpoint Service, with an Authorization header of "Bearer <token>".
  webhook:
    enabled: false
    path: /alerts/webhook

# External Secrets Operator. Nothing secret is committed to this repo;
# the chart only names where to find it.
externalSecrets:
  enabled: true
  # Every cluster in this estate runs ESO with the Kubernetes provider
  # and a ClusterSecretStore of this name, reading from a `secrets-store`
  # namespace on that same cluster - see ansible-rke2-installer's
  # external_secrets role. Nothing is shared across clusters, so the
  # remoteKeys below have to be seeded into whichever cluster this is
  # deployed to before the first sync.
  secretStoreRef:
    name: cluster-secrets-store
    kind: ClusterSecretStore
  refreshInterval: 1h
  keys:
    itsm:
      remoteKey: platform-agent-stack-itsm
      properties: [FRESHSERVICE_DOMAIN, FRESHSERVICE_APIKEY]
    llm:
      remoteKey: platform-agent-stack-llm
      properties: [ANTHROPIC_API_KEY]
    confluence:
      remoteKey: platform-agent-stack-confluence
      properties: [CONFLUENCE_BASE_URL, CONFLUENCE_USER, CONFLUENCE_API_TOKEN]
    # Guards POST /approvals/:id/approve and POST /actions/:verb - the two
    # routes that can change something. WITHOUT THIS, BOTH ROUTES RETURN 503
    # and refuse everything: a missing credential must never read as "no
    # authentication required". Chat approvals are unaffected, since they hold
    # the executor in-process and are gated by chat.approvers instead.
    approval:
      remoteKey: platform-agent-stack-approval
      properties: [APPROVAL_TOKEN]
      # Degrade rather than crash if it has not been seeded yet: the guarded
      # routes return 503 and say why, instead of the whole bridge failing to
      # start and taking triage, chat and investigation down with it.
      optional: true
    # Only needed when alerts.webhook.enabled. Separate from APPROVAL_TOKEN on
    # purpose: this one is handed to Grafana and lives in a contact point, so it
    # must be rotatable on its own and must not also unlock tier-3 approvals.
    alerts-webhook:
      remoteKey: platform-agent-stack-alerts-webhook
      properties: [ALERTS_WEBHOOK_TOKEN]
      optional: true
    # REQUIRED when itsmProvider is jira-service-management (the chart fails to
    # render without it). A SERVICE ACCOUNT API key, not a personal token: a
    # personal one attributes every ticket the agent raises to that human and
    # carries their whole permission set. An org admin must first enable API-key
    # auth for the Rovo MCP Server under Security -> Atlassian Rovo MCP Server.
    # Harmless while Freshservice is selected - optional means an unseeded key
    # degrades rather than blocking pod start.
    atlassian:
      remoteKey: platform-agent-stack-atlassian
      properties: [ATLASSIAN_API_KEY]
      optional: true

resources:
  requests: { cpu: 250m, memory: 512Mi }
  limits:   { cpu: "2",  memory: 2Gi }

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  seccompProfile: { type: RuntimeDefault }

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities: { drop: ["ALL"] }

nodeSelector: {}
tolerations: []

# Spread replicas across nodes. Soft rather than required: on a small cluster,
# or one where taints leave few schedulable nodes, a hard rule would leave the
# second replica Pending forever and quietly halve the availability it was
# added to provide.
affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          topologyKey: kubernetes.io/hostname
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: platform-agent-stack

# Optional: durable state for the bridge's pending tier-3 approvals,
# provisioned by mongostate-crossplane's MongoState claim. Crossplane
# only runs on the controller cluster, so this is read cross-cluster via
# a dedicated ClusterSecretStore this chart creates (the one cluster-
# scoped resource in an otherwise namespaced chart - see
# templates/clustersecretstore-controller.yaml). Off by default: the
# bridge falls back to in-memory approvals (see bridge/src/approvalsStore.js)
# when MONGO_URI is unset.
mongoState:
  enabled: false
  # Controller's API server, reachable from this cluster.
  controllerApiServer: "https://192.168.11.70:6443"
  # base64 CA bundle for controllerApiServer. Get it from controller:
  #   kubectl get secret tooling-mongostate-reader-token -n crossplane-system -o jsonpath='{.data.ca\.crt}'
  controllerCaBundle: ""
  # Secret on THIS cluster holding the token minted for controller's
  # tooling-mongostate-reader ServiceAccount (mongostate-crossplane's
  # manifests/rbac-tooling-reader.yaml). Seeded manually - same pattern
  # as every other credential in this chart, just sourced from a
  # different cluster's kubectl instead of a SaaS provider:
  #   kubectl get secret tooling-mongostate-reader-token -n crossplane-system -o jsonpath='{.data.token}' | base64 -d
  #   (on the TOOLING cluster) kubectl create secret generic controller-mongostate-reader-token -n agents --from-literal=token=<pasted value>
  tokenSecretName: controller-mongostate-reader-token
  # The MongoState claim's connection secret.
  #
  # The namespace is `agents`, NOT crossplane-system. Crossplane writes a
  # claim's connection secret into the CLAIM's own namespace when
  # writeConnectionSecretToRef carries only a name, and that claim sets only a
  # name. Getting this wrong reads the wrong namespace and ESO reports a bare
  # "could not get secret data from provider" that says nothing about why.
  remoteSecretName: agent-swarm-state
  remoteSecretNamespace: agents
  # Tailnet name of the MongoDB, exposed from controller by
  # mongostate-crossplane's manifests/tailscale-expose.yaml. When set, the
  # chart creates a local egress Service and points the driver at it - the
  # address inside the connection secret only resolves on controller.
  # Leave empty when the database is in the same cluster.
  tailnetFqdn: ""
  # Name of the local egress Service. Short on purpose: a Service name is a
  # DNS label capped at 63 chars and this chart's fullname is already 62.
  egressServiceName: mongo-egress
