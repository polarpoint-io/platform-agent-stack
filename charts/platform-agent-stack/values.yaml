# Which ITSM backend to wire in. Must match a file under
# itsm-providers/providers/ AND one under itsm-providers/action-mappings/.
# The chart fails to render if either is missing.
itsmProvider: freshservice

# Which LLM backend to wire in. Must match a file under llm-providers/
# (rename the .example to enable it). The chart fails to render if missing.
llmProvider: modelplane

image:
  # ghcr.io/ruvnet/ruflo never existed (verified via authenticated GHCR
  # registry API - not just anonymous-pull denial). Built in-house from
  # the real npm package by this repo's Dockerfile +
  # .github/workflows/build-ruflo-image.yml.
  repository: ghcr.io/polarpoint-io/ruflo
  # Same floor as ruflo-bridge — below 3.16.3 the MCP bridge is
  # unauthenticated (CVE-2026-59726). Asserted at render time. 3.34.0 is
  # the version installed when this image was last built.
  tag: "3.34.0"
  pullPolicy: IfNotPresent

replicaCount: 1

# The bridge Service this swarm talks to. Deployed by the ruflo-bridge
# chart, which ArgoCD syncs as a separate Application.
bridge:
  serviceName: ruflo-bridge
  port: 3000

# Port the real `ruflo start` command's own embedded MCP server listens on
# inside this pod (separate from the bridge above - see deployment.yaml's
# comment on the args for what `ruflo start` actually does vs. what
# swarm.config.json assumes).
mcp:
  port: 3000

# External Secrets Operator. Nothing secret is committed to this repo;
# the chart only names where to find it.
externalSecrets:
  enabled: true
  # TODO(verify): SecretStore name and backing paths are placeholders.
  # Set these to your actual ClusterSecretStore before syncing.
  secretStoreRef:
    name: polarpoint-secret-store
    kind: ClusterSecretStore
  refreshInterval: 1h
  keys:
    # effytech/freshservice_mcp (self-hosted, stdio) needs real credentials
    # injected as env vars - unlike Atlassian's hosted MCP server (the
    # jira-service-management default), which authenticates per-user over
    # OAuth and needs none of these. If you switch itsmProvider back to
    # jira-service-management, this block becomes unused unless you also
    # swap to self-hosted mcp-atlassian.
    itsm:
      remoteKey: platform-agent-stack/itsm
      properties: [FRESHSERVICE_DOMAIN, FRESHSERVICE_APIKEY]
    llm:
      remoteKey: platform-agent-stack/llm
      properties: [MODELPLANE_ENDPOINT, MODELPLANE_API_KEY, MODELPLANE_MODEL]
    confluence:
      remoteKey: platform-agent-stack/confluence
      properties: [CONFLUENCE_BASE_URL, CONFLUENCE_USER, CONFLUENCE_API_TOKEN]

# Mongo-compatible state, provisioned by mongostate-crossplane. The claim
# writes a Secret with this name into the release namespace.
state:
  connectionSecret: agent-swarm-state

resources:
  requests: { cpu: 250m, memory: 512Mi }
  limits:   { cpu: "2",  memory: 2Gi }

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  seccompProfile: { type: RuntimeDefault }

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities: { drop: ["ALL"] }

nodeSelector: {}
tolerations: []
affinity: {}
