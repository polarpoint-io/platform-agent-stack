# Risk-tiered execution policy — shared across itsm-support AND
# sre-investigator. Tier goes up as blast radius goes up. Nothing above
# tier 2 runs unattended.

# How an action that appears in NO tier below is treated. Enumerating
# four tiers says nothing about the unlisted verb, and the unlisted verb
# is exactly the one a new MCP server introduces — a tool list can grow
# without this file changing. Fail closed.
default_policy:
  unlisted_action: tier_4_draft_only
  on_unlisted: warn   # log the verb by name so it can be tiered properly
  # Set to tier_1_auto only if you have a specific reason and have
  # accepted that any newly-added tool executes unattended by default.

risk_tiers:

  tier_1_auto:
    description: "Read-only or fully reversible — no approval needed"
    actions:
      - search_tickets
      - get_ticket
      - search_confluence
      - get_confluence_page
      - list_kb_articles
      - runbook_search
      - runbook_get
      # NOTE: runbook_gap_detect was listed here and holmesgpt-runbook-mcp
      # has never exposed such a tool - verified against its live tools/list
      # on 2026-08-05. Removed rather than left as an aspiration: a tiered
      # verb nothing implements looks supported and silently isn't.
      - root_cause_analyse
      - investigation_classify
      # Read-only lookup of the ITSM backend's own ticket field config -
      # required fields, valid choices (e.g. which groups exist). Freshservice
      # tenants can mark Group and Agent mandatory, and freshservice-mcp's
      # create_ticket has no group_id/responder_id parameter, so a call is
      # rejected with "missing_field" and there is no way to discover a valid
      # value. This makes the requirement and the valid options visible over
      # chat without anyone touching the API key directly.
      - list_ticket_fields

  tier_2_notify:
    description: "Low-risk write — executes immediately, posts to Slack for visibility"
    actions:
      - add_ticket_comment
      - update_ticket_status
      - runbook_draft   # opens a draft PR/MR — inert until a human merges it
      # Filing a ticket does not grant access. grant_access stays tier 4
      # and unmapped. There is no separate access-request verb: any
      # create_ticket the model calls, including an access request, runs
      # now. Caller email is still forced from the verified UPN when one
      # is present (identity.js). close_ticket and assign_ticket stay
      # tier 3.
      - create_ticket

  tier_3_approval:
    description: "Requires explicit human approval before executing"
    actions:
      - close_ticket
      - assign_ticket
      - k8s_restart   # Kubernetes Remediation (MCP) — not currently enabled;
      - k8s_scale     # tiering documented here so it's ready if that changes

  tier_4_draft_only:
    description: "Agent drafts the action; a human performs it. Never auto-executed."
    actions:
      - grant_access
      - revoke_access
      - modify_identity
      - modify_production_infra
      - k8s_drain     # Kubernetes Remediation (MCP) — not currently enabled
