{{- if .Values.mongoState.enabled }}
# Cross-cluster read access to mongostate-crossplane's connection secret
# on the controller cluster (Crossplane only runs there - see that
# repo's README "Deploying"). Auth is a token for controller's
# tooling-mongostate-reader ServiceAccount, scoped read-only to exactly
# this one secret name (mongostate-crossplane's manifests/rbac-tooling-
# reader.yaml). This is cluster-scoped and the one resource this
# otherwise namespaced chart creates outside its own namespace.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: controller-cluster-secrets-store
spec:
  provider:
    kubernetes:
      remoteNamespace: {{ .Values.mongoState.remoteSecretNamespace }}
      server:
        url: {{ .Values.mongoState.controllerApiServer | quote }}
        caBundle: {{ .Values.mongoState.controllerCaBundle | quote }}
      auth:
        token:
          bearerToken:
            name: {{ .Values.mongoState.tokenSecretName }}
            key: token
{{- end }}
