apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "platform-agent-stack.fullname" . }}
  labels: {{- include "platform-agent-stack.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels: {{- include "platform-agent-stack.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels: {{- include "platform-agent-stack.labels" . | nindent 8 }}
      annotations:
        # Roll the pods when any config changes, otherwise a policy edit
        # sits in the ConfigMap while the running bridge uses the old one.
        checksum/config: {{ (.Files.Glob "{swarm,policy,itsm-providers,llm-providers,mcp}/**").AsConfig | sha256sum }}
    spec:
      securityContext: {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: bridge
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
            {{- if .Values.chat.endpoint.enabled }}
            # Only the inbound chat route is served here. Kept apart from http
            # so an Ingress can be pointed at one without reaching the other.
            - name: chat
              containerPort: {{ .Values.chat.endpoint.port }}
            {{- end }}
          env:
            - name: PORT
              value: "{{ .Values.service.port }}"
            {{- if .Values.chat.endpoint.enabled }}
            - name: PUBLIC_PORT
              value: "{{ .Values.chat.endpoint.port }}"
            {{- end }}
            # swarm.config.json resolves actionMapping via ${ITSM_PROVIDER}.
            # config.js reads the already-rendered /config/action-mappings.yaml
            # instead, so nothing breaks when this is unset - but the
            # placeholder then survives substitution and config.js logs a
            # warning for it at every boot. Set it from the same value the
            # chart used to pick the mapping, so the two can't disagree.
            - name: ITSM_PROVIDER
              value: {{ .Values.itsmProvider | quote }}
            # readOnlyRootFilesystem is on and /tmp is the only writable
            # mount, but uvx spawns the ITSM MCP server and wants a cache
            # under $HOME. Left at the image default (/home/bridge) it dies
            # with ENOENT/EROFS before the server ever starts. Point every
            # cache uv and npm might reach for at the emptyDir.
            - name: HOME
              value: /tmp
            - name: XDG_CACHE_HOME
              value: /tmp/.cache
            - name: XDG_DATA_HOME
              value: /tmp/.local/share
            - name: UV_CACHE_DIR
              value: /tmp/.cache/uv
            - name: UV_PYTHON_INSTALL_DIR
              value: /tmp/.local/share/uv/python
            - name: NPM_CONFIG_CACHE
              value: /tmp/.npm
            # The SDK default is 60s. runbook_draft runs an LLM generation
            # then opens a PR and blew through it - having already created
            # the PR, so the caller saw a failure for a completed action.
            - name: MCP_TOOL_TIMEOUT_MS
              value: {{ .Values.mcpToolTimeoutMs | quote }}
            {{- if and .Values.mongoState.enabled .Values.mongoState.tailnetFqdn }}
            # The connection secret's host only resolves on the controller
            # cluster. Point the driver at the local tailnet egress Service
            # instead; stateStore.js also forces directConnection, because
            # replica-set discovery would send it back to the unreachable
            # internal names.
            - name: MONGO_HOST_OVERRIDE
              value: "{{ include "platform-agent-stack.mongoEgressName" . }}:27017"
            {{- end }}
            {{- if ne .Values.chat.provider "none" }}
            - name: CHAT_PROVIDER
              value: {{ .Values.chat.provider | quote }}
            - name: CHAT_APPROVERS
              value: {{ join "," .Values.chat.approvers | quote }}
            {{- end }}
            - name: HOLMES_URL
              value: {{ .Values.holmesUrl | quote }}
            - name: HOLMES_RUNBOOK_MCP_URL
              value: {{ .Values.holmesRunbookMcpUrl | quote }}
            {{- if .Values.holmesRunbookMcpResultIsErrorWhen }}
            # Same quirk the ITSM providers declare in their .mcp.json, but
            # runbook_mcp is configured by URL rather than as an mcpServers
            # entry, so it needs its own way to say it. Without this, a
            # Confluence failure comes back as a healthy tier_1 result.
            - name: RUNBOOK_MCP_RESULT_IS_ERROR_WHEN
              value: {{ .Values.holmesRunbookMcpResultIsErrorWhen | quote }}
            {{- end }}
            {{- if .Values.slackWebhookUrl }}
            - name: SLACK_WEBHOOK_URL
              value: {{ .Values.slackWebhookUrl | quote }}
            {{- end }}
          envFrom:
            {{- range $name, $cfg := .Values.externalSecrets.keys }}
            - secretRef:
                name: {{ include "platform-agent-stack.fullname" $ }}-{{ $name }}
            {{- end }}
            {{- if .Values.mongoState.enabled }}
            - secretRef:
                name: {{ include "platform-agent-stack.fullname" . }}-mongo
                optional: true
            {{- end }}
          securityContext: {{- toYaml .Values.securityContext | nindent 12 }}
          resources: {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - { name: config, mountPath: /config, readOnly: true }
            - { name: mcp,    mountPath: /app/.mcp.json, subPath: .mcp.json, readOnly: true }
            - { name: tmp,    mountPath: /tmp }
          readinessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 20
            periodSeconds: 20
      volumes:
        - name: config
          configMap: { name: {{ include "platform-agent-stack.fullname" . }}-config }
        - name: mcp
          configMap: { name: {{ include "platform-agent-stack.fullname" . }}-mcp }
        - name: tmp
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
