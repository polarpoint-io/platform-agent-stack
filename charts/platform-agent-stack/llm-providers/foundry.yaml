# Azure AI Foundry — OpenAI-compatible LLM backend.
#
# Credentials come from the environment. Nothing secret belongs in here.

provider: azure-ai-foundry
type: openai-compatible

endpoint: ${AZURE_FOUNDRY_ENDPOINT}
apiKey: ${AZURE_FOUNDRY_API_KEY}
apiVersion: "2026-02-01"

models:
  default: ${AZURE_FOUNDRY_DEPLOYMENT}
  # Triage is high-volume and low-stakes; investigation is the opposite.
  # Splitting them is what makes a cheaper model on the router worthwhile.
  triage: ${AZURE_FOUNDRY_DEPLOYMENT_FAST}

timeouts:
  requestSeconds: 120
  connectSeconds: 10

retry:
  maxAttempts: 3
  backoff: exponential
