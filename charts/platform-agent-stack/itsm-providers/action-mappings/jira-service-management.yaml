# Generic policy verb  ->  the tool name this MCP server actually exposes.
#
# READ THIS BEFORE EDITING
# The left column must match a verb in ../../policy/risk-tiers.yaml. A verb
# here that appears in no tier falls to default_policy.unlisted_action
# (tier_4_draft_only); scripts/validate-config.sh warns when that happens.
#
# The failure this file causes is silent: map a verb to the wrong tool and
# the agent performs an action under the wrong tier's gating. Nothing errors.

provider: jira-service-management

# Tool names below are the Atlassian Remote MCP Server's, as exposed by a
# live connection. They are not guesses — but they are also not a promise
# about YOUR instance. Confirm with tools/list before trusting them, and
# re-check after Atlassian ships changes.

actions:
  # tier 1 — read-only
  search_tickets:       searchJiraIssuesUsingJql
  get_ticket:           getJiraIssue

  # NO KNOWLEDGE VERBS HERE, deliberately. list_kb_articles, search_confluence
  # and get_confluence_page stay unmapped for this provider because
  # holmesgpt-runbook-mcp already serves that lane, from the same Confluence
  # space, and better: it returns STRUCTURED runbooks (service, failure_mode,
  # alert_name, severity, mttr, owner) where searchConfluenceUsingCql returns
  # raw pages for a CQL string. Verified live 2026-08-19 - runbook_search found
  # "RB - payments-api OOMKill" in spaces/RAID. Both paths are tier_1.
  #
  # Mapping them would give the model two ways to ask one question, the worse
  # one included, and would need Confluence scopes on the Atlassian key for no
  # gain. The ITSM backend's job is tickets.
  #
  # They remain in ../../policy/risk-tiers.yaml because the FRESHSERVICE mapping
  # does implement two of them against its own solution-article tools. A verb
  # being untiered is a different thing from a provider not implementing it.

  # tier 2 — low-risk write, executes and notifies
  add_ticket_comment:   addCommentToJiraIssue

  # tier 3 — needs human approval before executing
  create_ticket:        createJiraIssue

  # ---------------------------------------------------------------------
  # NOT MAPPED, deliberately. Read before adding them.
  #
  # update_ticket_status (tier 2) and close_ticket (tier 3) are BOTH
  # transitionJiraIssue. Jira models "move to In Progress" and "close" as
  # the same operation with a different transition id, so a verb-to-tool
  # mapping cannot tell them apart. Mapping update_ticket_status here
  # would let a tier-2 auto-execute perform a tier-3 close.
  #
  # Fixing this properly needs the tier decision to consider the
  # transition id, not just the tool name — which risk-tiers.yaml has no
  # way to express today. Until it does, both stay unmapped and a human
  # does transitions.
  #
  # update_ticket_status: transitionJiraIssue
  # close_ticket:         transitionJiraIssue
  #
  # assign_ticket (tier 3) is editJiraIssue — the same general-purpose
  # field editor that can rewrite summary, description, priority or any
  # custom field. Mapping a single tier-3 verb to it grants far more than
  # "assign". Left unmapped for the same reason.
  #
  # assign_ticket: editJiraIssue
  # ---------------------------------------------------------------------

  # tier 4 — agent drafts, human performs. Deliberately unmapped: an
  # unmapped verb cannot execute at all.
  # grant_access / revoke_access / modify_identity have no entry by design.

# Appended to the tool description the model sees, and read only by
# bridge/src/itsmAgent.js — policy.js ignores this block entirely, so
# nothing here can affect a tier decision.
#
# The JQL rules below are not stylistic. Both were hit against the live server
# on 2026-08-18 and both are hard failures, not warnings.
argument_hints:
  create_ticket: >-
    Do NOT supply cloudId or projectKey. Both are injected by the bridge from
    deployment config and anything you provide for them is overwritten.
    issueTypeName IS yours to choose and is required. The target project DO is a
    Jira SOFTWARE project, not a service desk, and its issue types were read
    from live metadata on 2026-08-18: Epic, Story, Task, Sub-task, Bug. Use
    "Bug" when something is broken or degraded, and "Task" for everything else
    (access requests, provisioning, how-do-I). Do NOT use "Service Request",
    "Incident" or any other JSM request type — they do not exist in this project
    and the call fails. Put the user's own words in summary, and the full
    context (who reported it, what they observed, when it started) in
    description.
  add_ticket_comment: >-
    Do NOT supply cloudId — it is injected by the bridge. issueIdOrKey is the
    Jira key like DO-123, not a numeric database id, unless the user gave you a
    numeric id explicitly.
  search_tickets: >-
    Do NOT supply cloudId — it is injected. jql is real JQL and TWO rules apply.
    (1) ALWAYS quote the project key: project = "DO". DO is a reserved JQL word
    and an unquoted key is rejected outright with 'DO is a reserved JQL word'.
    (2) NEVER send an unbounded query. Jira rejects one with 'Unbounded JQL
    queries are not allowed here' — always include a restriction, not just an
    ORDER BY. A good default is
    project = "DO" AND status != Done ORDER BY created DESC.
  get_ticket: >-
    Do NOT supply cloudId — it is injected. issueIdOrKey is the Jira key
    like DO-123.
